<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off the Hook — Fresh & Frozen Fish</title>
<meta name="description" content="Off the Hook — fresh and frozen fish, free range eggs and chicken. Cold chain from our door to yours.">
<style>
/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--sand);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
}
:root{
  --deep:#05202e;--ocean:#0a3a52;--teal:#12a3a3;--aqua:#5fd6cf;--coral:#ff6a45;
  --sand:#f2f7f8;--ink:#0c1a22;--muted:#6d8a97;--line:#e0e9ec;--white:#fff;
  --ok:#1f9d6b;--warn:#d9932a;--danger:#dd5252;--r:16px;
  --sh:0 10px 30px rgba(6,32,46,.08);--sh2:0 22px 55px rgba(6,32,46,.16);
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.hide{display:none!important}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;
  border-radius:999px;font-weight:650;font-size:14px;transition:.18s;white-space:nowrap;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(255,106,69,.32)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(255,106,69,.42);transform:translateY(-1px)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 8px 20px rgba(18,163,163,.28)}
.btn-teal:hover{transform:translateY(-1px)}
.btn-ghost{border-color:rgba(255,255,255,.28);color:#eaf6f8}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-outline{border-color:var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-dark{background:var(--deep);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-lg{padding:15px 28px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============================ HEADER ============================ */
.hdr{position:sticky;top:0;z-index:60;background:rgba(5,32,46,.97);backdrop-filter:blur(12px);
  color:#eaf6f8;border-bottom:1px solid rgba(255,255,255,.09)}
.hdr-in{display:flex;align-items:center;gap:16px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;font-size:19px}
.brand span i{color:var(--aqua);font-style:normal}
.nav{display:flex;gap:4px;margin-left:14px}
.nav a{padding:9px 14px;border-radius:999px;font-size:14px;font-weight:550;color:#c8dfe5;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.on{background:rgba(95,214,207,.16);color:var(--aqua)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
  font-size:14px;font-weight:600;color:#dceef2;border:1px solid rgba(255,255,255,.16);transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.burger{display:none;padding:9px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.18)}
.mnav{display:none;border-top:1px solid rgba(255,255,255,.09);padding:10px 0 16px}
.mnav a{display:block;padding:12px 16px;border-radius:12px;font-weight:600;color:#d5e9ee}
.mnav a:hover{background:rgba(255,255,255,.08)}
@media(max-width:920px){
  .nav{display:none}
  .burger{display:inline-flex}
  .hdr.open .mnav{display:block}
  .hdr-right .lbl{display:none}
}

/* ============================ HERO ============================ */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(1200px 600px at 15% -10%,rgba(18,163,163,.55),transparent 60%),
  radial-gradient(900px 500px at 95% 10%,rgba(255,106,69,.28),transparent 60%),
  linear-gradient(160deg,#05202e,#0a3a52 60%,#062a3b);
  color:#fff}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:70px 0 76px}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:830;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--aqua)}
.hero p.lead{margin-top:16px;font-size:17px;color:#bcd8e0;max-width:520px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-img{border-radius:26px;overflow:hidden;box-shadow:var(--sh2);border:1px solid rgba(255,255,255,.14)}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid rgba(255,255,255,.13)}
.trust div{font-size:13px;color:#a9cbd5}
.trust b{display:block;color:#fff;font-size:15px;font-weight:700}
@media(max-width:860px){.hero-in{grid-template-columns:1fr;padding:46px 0 54px;gap:30px}}

/* ============================ SECTIONS ============================ */
.sec{padding:56px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.sec-head p{color:var(--muted);font-size:14px;margin-top:6px}

/* ============================ PRODUCT GRID ============================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:20px}
.pcard{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  display:flex;flex-direction:column;transition:.2s;box-shadow:0 2px 8px rgba(6,32,46,.04)}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:#cfe3e8}
.pcard-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#05202e}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:.5s}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.tag{position:absolute;top:10px;left:10px;background:rgba(5,32,46,.82);color:#c9f2ee;backdrop-filter:blur(6px);
  padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tag.soon{background:rgba(255,106,69,.9);color:#fff}
.pcard-b{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-b h3{font-size:15.5px;font-weight:700}
.pcard-sub{font-size:12.5px;color:var(--muted);flex:1}
.pcard-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.price{font-weight:800;font-size:17px;letter-spacing:-.02em}
.price small{font-weight:600;font-size:11.5px;color:var(--muted);display:block;letter-spacing:0}

/* ============================ FILTERS ============================ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;
  font-weight:600;color:#3d5b67;transition:.15s}
.chip:hover{border-color:var(--aqua)}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
select.inp,input.inp,textarea.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:#fff;outline:none;transition:.15s;font-size:14.5px}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,163,163,.14)}
label.fl{display:block;font-size:12.5px;font-weight:700;color:#45636f;margin:0 0 6px 2px;letter-spacing:.01em}

/* ============================ CARDS / PANELS ============================ */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 2px 10px rgba(6,32,46,.04)}
.panel+.panel{margin-top:18px}
.panel h3{font-size:17px;font-weight:750;margin-bottom:4px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}

/* ============================ LAYOUT HELPERS ============================ */
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ============================ KPI ============================ */
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.kpi .k{font-size:11.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:830;letter-spacing:-.03em;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.accent{background:linear-gradient(150deg,#05202e,#0d4258);color:#fff;border-color:transparent}
.kpi.accent .k{color:#8fc4d1}.kpi.accent .d{color:#9dc3ce}

/* ============================ CHART ============================ */
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:14px}
.chart-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;min-width:0}
.chart-bar{background:linear-gradient(180deg,var(--aqua),var(--teal));border-radius:7px 7px 0 0;min-height:4px;
  position:relative;transition:.3s}
.chart-bar:hover{filter:brightness(1.12)}
.chart-lbl{font-size:10.5px;color:var(--muted);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ FUNNEL ============================ */
.funnel{display:flex;flex-direction:column;gap:10px}
.fn-row{display:grid;grid-template-columns:140px 1fr 64px;gap:12px;align-items:center;font-size:13.5px}
.fn-track{height:26px;background:#eef4f6;border-radius:8px;overflow:hidden}
.fn-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--aqua));transition:.5s}
.fn-val{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
@media(max-width:520px){.fn-row{grid-template-columns:96px 1fr 52px;font-size:12px}}

/* ============================ TABLE ============================ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--line);font-weight:750;white-space:nowrap}
table.tbl td{padding:12px;border-bottom:1px solid #f0f5f7;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr:hover td{background:#fafdfe}

/* ============================ PILLS ============================ */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:750;
  letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:#e5f7ef;color:#12734d}
.pill.warn{background:#fdf3e2;color:#96601a}
.pill.info{background:#e6f2fa;color:#1a5d85}
.pill.danger{background:#fdeaea;color:#a33333}
.pill.neutral{background:#eef3f5;color:#5a7783}
.pill.purple{background:#f0eafc;color:#5a3aa8}

/* ============================ TIMELINE ============================ */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline li{position:relative;padding:0 0 20px}
.timeline li:last-child{padding-bottom:0}
.timeline .dot{position:absolute;left:-26px;top:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2.5px solid var(--line)}
.timeline li.done .dot{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 4px rgba(18,163,163,.14)}
.timeline li.cur .dot{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 5px rgba(255,106,69,.18)}
.timeline b{font-size:14px;font-weight:700;display:block}
.timeline small{color:var(--muted);font-size:12px}

/* ============================ TABS ============================ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 17px;border-radius:999px;font-size:13.5px;font-weight:650;color:#456470;
  border:1px solid var(--line);background:#fff;white-space:nowrap;transition:.15s}
.tab:hover{border-color:var(--aqua)}
.tab.on{background:var(--deep);border-color:var(--deep);color:#fff}

/* ============================ CART ============================ */
.citem{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eff4f6}
.citem:last-child{border-bottom:0}
.citem img{width:88px;height:70px;object-fit:cover;border-radius:12px}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:#fff}
.qty button{width:32px;height:32px;display:grid;place-items:center;font-weight:800;color:#3d5b67;border-radius:999px}
.qty button:hover{background:#eef6f8}
.qty span{min-width:26px;text-align:center;font-weight:750;font-size:14px}
@media(max-width:560px){.citem{grid-template-columns:70px 1fr;gap:10px}.citem img{width:70px;height:60px}
  .citem .c-actions{grid-column:2;display:flex;justify-content:space-between;align-items:center;margin-top:8px}}

/* ============================ SUMMARY ============================ */
.sum-row{display:flex;justify-content:space-between;padding:9px 0;font-size:14.5px;color:#3d5b67}
.sum-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:19px;font-weight:830;color:var(--ink)}

/* ============================ AD PREVIEW ============================ */
.ad{max-width:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.ad-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ad-top b{font-size:13.5px;display:block}
.ad-top small{font-size:11.5px;color:var(--muted)}
.ad img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ad-body{padding:14px}
.ad-body b{font-size:15.5px;display:block;margin-bottom:6px}
.ad-body p{font-size:13.5px;color:#42606c}
.ad-tags{color:#1a7f9c!important;margin-top:8px;font-size:12.5px!important}
.ad-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  border-top:1px solid var(--line);background:#f8fbfc}
.ad-foot span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ LANDING ============================ */
.lp-hero{background:linear-gradient(160deg,#05202e,#0a3a52);color:#fff;border-radius:22px;overflow:hidden;
  display:grid;grid-template-columns:1.1fr .9fr;gap:0;box-shadow:var(--sh2)}
.lp-hero .lp-copy{padding:44px}
.lp-hero h1{font-size:clamp(26px,3.6vw,42px);font-weight:830;letter-spacing:-.035em}
.lp-hero p{margin-top:14px;color:#bcd8e0;font-size:16px;max-width:460px}
.lp-hero img{width:100%;height:100%;object-fit:cover;min-height:300px}
@media(max-width:820px){.lp-hero{grid-template-columns:1fr}.lp-hero .lp-copy{padding:30px}}

/* ============================ AUTH ============================ */
.auth-wrap{max-width:440px;margin:46px auto}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--sh)}
.auth-card h2{font-size:23px;font-weight:800;margin-bottom:6px}

/* ============================ TOAST ============================ */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);z-index:200;
  background:var(--deep);color:#fff;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:var(--sh2);transition:.32s cubic-bezier(.2,.9,.3,1.3);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ============================ MISC ============================ */
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:8px}
.note{background:#eef8fa;border:1px solid #d3ebef;border-radius:12px;padding:12px 14px;font-size:13px;color:#2c5d6b}
.note.warn{background:#fdf7ea;border-color:#f3e3c4;color:#7a5a1c}
.note.ok{background:#eaf8f1;border-color:#cfecdd;color:#1a6a49}
.ftr{background:var(--deep);color:#9fc0cb;margin-top:60px;padding:44px 0 30px;font-size:13.5px}
.ftr h4{color:#fff;font-size:14px;margin-bottom:12px;font-weight:750}
.ftr a{display:block;padding:5px 0;color:#9fc0cb}
.ftr a:hover{color:var(--aqua)}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}
@media(max-width:760px){.ftr-grid{grid-template-columns:1fr 1fr}}
.ftr-bot{border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:20px;display:flex;
  justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#7ea4b1}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>

<header class="hdr" id="hdr"></header>
<main id="app"></main>
<footer class="ftr" id="ftr"></footer>
<div id="toast"></div>

<script>
/* =====================================================================
   OFF THE HOOK — single-file storefront + dashboards + pull marketing
   ===================================================================== */

/* ------------------------------ UTILITIES ------------------------------ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'R' + (Number(n)||0).toFixed(2);
const uid = p => p + Math.random().toString(36).slice(2,9);
const rng = seed => { let s=(seed>>>0)||1; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); };
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pickR = (arr,R)=>arr[Math.floor(R()*arr.length)];
const hashPw = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(16); };
const fmtDate = t => new Date(t).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT   = t => new Date(t).toLocaleString('en-ZA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const pct = (a,b)=> b>0 ? (a/b*100) : 0;
const pctS = (a,b)=> pct(a,b).toFixed(1)+'%';

function toast(msg,ms=2400){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms);
}

/* ------------------------------ ART ENGINE (procedural "AI" imagery) ------------------------------ */
function artDataURI(o){
  const {hue=196,kind='fish',seed=7,w=800,h=600}=o;
  const R=rng(seed*7919+13);
  const bgA=`hsl(${hue} 62% 8%)`, bgB=`hsl(${(hue+35)%360} 58% 22%)`;
  const b1=`hsl(${(hue+10)%360} 66% 65%)`, b2=`hsl(${(hue+42)%360} 68% 36%)`;
  const fin=`hsl(${(hue+62)%360} 76% 56%)`;

  let deco='';
  for(let i=0;i<18;i++){
    deco+=`<circle cx="${(R()*w)|0}" cy="${(R()*h)|0}" r="${(2+R()*9).toFixed(1)}" fill="#e8fbff" opacity="${(0.03+R()*0.09).toFixed(2)}"/>`;
  }
  let waves='';
  for(let i=0;i<5;i++){
    const y=h*0.68+i*18;
    waves+=`<path d="M0 ${y} Q ${w*0.25} ${y-26} ${w*0.5} ${y} T ${w} ${y} L${w} ${h} L0 ${h} Z" fill="hsl(${(hue+18)%360} 55% ${13+i*4}%)" opacity=".8"/>`;
  }

  const s=w/800;
  let subj='';
  if(kind==='fish'){
    subj=`<g transform="translate(${w/2} ${h*0.44}) scale(${(s*1.2).toFixed(3)})">
      <path d="M-150 0 L-262 -80 L-228 0 L-262 80 Z" fill="url(#bd)"/>

let SESSION=null;

  let sid=sessionStorage.getItem('oth_sid');

  if(!DB.analytics.sessions[sid]){

  }
  SESSION=DB.analytics.sessions[sid];
  return SESSION;
}
function track(type,meta={}){
  const s=currentSession(); s.events.push({type,meta,t:Date.now()}); s.last=Date.now(); save();
}
function trackPage(path){
  const s=currentSession();
  s.pageviews.push({path,t:Date.now()});
  s.last=Date.now();
  if(!s.landing) s.landing=path;
  save();
}
function setAttribution(q){
  const s=currentSession();
  if(s.source==='direct' && q && q.src){ s.source=q.src; }
  if(q && q.c && !s.campaign){ s.campaign=q.c; }
  if(q && q.src && s.landing==='/'){ s.landing = location.hash.replace(/^#/,'') || '/'; }
  save();
}

/* ------------------------------ ANALYTICS MATH ------------------------------ */
function computeAnalytics(filterFn){
  let sessions=Object.values(DB.analytics.sessions);
  if(filterFn) sessions=sessions.filter(filterFn);
  const total=sessions.length;
  const bounced=sessions.filter(s=>s.pageviews.length<=1 && s.events.length===0).length;
  const converted=sessions.filter(s=>s.converted).length;
  const pv=sessions.reduce((a,s)=>a+s.pageviews.length,0);
  const has=t=>sessions.filter(s=>s.events.some(e=>e.type===t)).length;

  const orders=DB.orders.filter(o=>o.status!=='Cancelled');
  const revenue=orders.reduce((a,o)=>a+o.total,0);

  const bySource={};
  sessions.forEach(s=>{ bySource[s.source]=bySource[s.source]||{sessions:0,converted:0,bounced:0};
    bySource[s.source].sessions++; if(s.converted)bySource[s.source].converted++; if(s.pageviews.length<=1&&!s.events.length)bySource[s.source].bounced++; });

  const byCampaign={};
  sessions.filter(s=>s.campaign).forEach(s=>{
    const k=s.campaign; byCampaign[k]=byCampaign[k]||{sessions:0,converted:0,bounced:0,adds:0,views:0};
    byCampaign[k].sessions++; if(s.converted)byCampaign[k].converted++;
    if(s.pageviews.length<=1&&!s.events.length)byCampaign[k].bounced++;
    if(s.events.some(e=>e.type==='add_to_cart'))byCampaign[k].adds++;
    byCampaign[k].views += s.pageviews.filter(p=>p.path.startsWith('/l/')).length;
  });

  return {
    total, pv, bounced, converted,
    bounceRate: total?bounced/total*100:0,
    convRate: total?converted/total*100:0,
    productViews: has('view_product'),
    adds: has('add_to_cart'),
    checkouts: has('checkout_start'),
    revenue, orders: DB.orders.length,
    aov: orders.length?revenue/orders.length:0,
    bySource, byCampaign,
  };
}
function dailySeries(days=14){
  const out=[];
  const now=new Date(); now.setHours(23,59,59,999);
  for(let i=days-1;i>=0;i--){
    const d=new Date(now.getTime()-i*86400000);
    const start=new Date(d); start.setHours(0,0,0,0);
    const end=new Date(d); end.setHours(23,59,59,999);
    const ss=Object.values(DB.analytics.sessions).filter(s=>s.first>=start.getTime()&&s.first<=end.getTime());
    const ords=DB.orders.filter(o=>o.created>=start.getTime()&&o.created<=end.getTime());
    out.push({label:d.toLocaleDateString('en-ZA',{day:'2-digit',month:'short'}),sessions:ss.length,orders:ords.length,
      revenue:ords.reduce((a,o)=>a+o.total,0)});
  }
  return out;
}
function barChart(data,valKey){

}

function cartCount(){ return state.cart.reduce((a,x)=>a+x.qty,0); }
function cartLines(){
  return state.cart.map(l=>{ const p=DB.products.find(x=>x.id===l.id); return p?{...p,qty:l.qty}:null; }).filter(Boolean);
}
function cartSub(){ return cartLines().reduce((a,x)=>a+x.price*x.qty,0); }
function cartDelivery(){ const s=cartSub(); return (s>0 && s<600)?65:0; }
function addToCart(id,qty=1){
  const p=DB.products.find(x=>x.id===id); if(!p||p.soon) return;
  const line=state.cart.find(x=>x.id===id);
  if(line) line.qty+=qty; else state.cart.push({id,qty});
  saveCart(); track('add_to_cart',{id}); toast(p.name+' added to cart'); render();
}
function setQty(id,qty){
  const line=state.cart.find(x=>x.id===id); if(!line) return;
  line.qty=qty; if(line.qty<=0) state.cart=state.cart.filter(x=>x.id!==id);
  saveCart(); render();
}
function restoreUser(){
  const uidv=localStorage.getItem('oth_uid');
  if(uidv){ const u=DB.users.find(x=>x.id===uidv); if(u) state.user=u; }
}

/* ------------------------------ ROUTER ------------------------------ */
function parseRoute(){
  const raw=(location.hash||'').replace(/^#\/?/,'');
  const [pathPart,queryPart]=raw.split('?');
  const parts=pathPart.split('/').filter(Boolean);
  const q=Object.fromEntries(new URLSearchParams(queryPart||''));
  return {name:parts[0]||'home',args:parts.slice(1),q};
}
const GUARDS={ account:'user', admin:'staff', owner:'owner', studio:'staff', orders:'user' };
function canAccess(level){
  const u=state.user;
  if(level==='user') return !!u;
  if(level==='staff') return !!u && (u.role==='admin'||u.role==='owner');
  if(level==='owner') return !!u && u.role==='owner';
  return true;
}

  if(state.user && state.user.role==='client') navItems.push(['#/account','My orders']);

  const cur='#/'+(r.name==='home'?'':r.name);
  $('#hdr').innerHTML=`
  <div class="wrap hdr-in">
    <a class="brand" href="#/">${logoSVG(38)}<span>Off the <i>Hook</i></span></a>

      <div><h4>Help</h4>

function funnelHTML(a){
  const steps=[
    ['Landing views',a.total],['Product views',a.productViews],
    ['Added to cart',a.adds],['Checkout started',a.checkouts],['Purchases',a.converted]
  ];
  const top=Math.max(a.total,1);
  return `<div class="funnel">${steps.map(([l,v])=>`
    <div class="fn-row">
      <span class="muted">${l}</span>
      <div class="fn-track"><div class="fn-fill" style="width:${clamp(v/top*100,0.8,100).toFixed(1)}%"></div></div>
      <span class="fn-val">${v}</span>
    </div>`).join('')}</div>`;
}
function sourceTable(a){
  const rows=Object.entries(a.bySource).sort((x,y)=>y[1].sessions-x[1].sessions);
  const total=rows.reduce((s,r)=>s+r[1].sessions,0)||1;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Source</th><th>Sessions</th><th>Share</th><th>Conversions</th><th>Conv. rate</th><th>Bounce</th></tr></thead>
    <tbody>${rows.map(([k,v])=>`<tr>
      <td><b>${esc(k)}</b></td>
      <td>${v.sessions}</td>
      <td>${pctS(v.sessions,total)}</td>
      <td>${v.converted}</td>
      <td><b style="color:${v.converted/v.sessions>0.05?'var(--ok)':'inherit'}">${pctS(v.converted,v.sessions)}</b></td>
      <td>${pctS(v.bounced,v.sessions)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}
function campaignTable(a,manage){
  const keys=Object.keys(a.byCampaign);
  if(!keys.length) return `<div class="empty"><h3>No campaign traffic yet</h3><p>Publish a landing page in the Marketing Studio to start tracking.</p></div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Campaign</th><th>Landing views</th><th>Sessions</th><th>Add to cart</th><th>Orders</th><th>Conv. rate</th><th>Bounce</th>${manage?'<th></th>':''}</tr></thead>
    <tbody>${keys.sort((x,y)=>a.byCampaign[y].sessions-a.byCampaign[x].sessions).map(k=>{
      const v=a.byCampaign[k];
      const c=DB.campaigns.find(x=>x.slug===k);
      return `<tr>
        <td><b>${esc(k)}</b>${c?`<div class="small muted">${esc(c.productName)}</div>`:''}</td>
        <td>${v.views}</td>
        <td>${v.sessions}</td>
        <td>${v.adds}</td>
        <td>${v.converted}</td>
        <td><b style="color:${v.converted/v.sessions>0.05?'var(--ok)':'inherit'}">${pctS(v.converted,v.sessions)}</b></td>
        <td>${pctS(v.bounced,v.sessions)}</td>
        ${manage?`<td>${c?`<a class="btn btn-outline btn-sm" href="#/l/${c.slug}?src=instagram&c=${c.slug}" target="_self">View LP</a>`:''}</td>`:''}
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}
function kpiRow(a,owner){

    <div class="kpi accent"><div class="k">Revenue</div><div class="v">${money(a.revenue)}</div><div class="d">${a.orders} orders · AOV ${money(a.aov)}</div></div>

                <button class="btn btn-outline btn-sm" data-act="toggle-pub" data-id="${c.id}">${c.published?'Unpublish':'Publish'}</button>
              </td>
            </tr>`).join('')}</tbody>
          </table></div>`:`<div class="empty"><h3>No campaigns yet</h3><p>Head to the Marketing Studio to generate your first one.</p></div>`}
        </div>
      `:''}
    </div>
  </section>`;
}

/* =====================================================================
   EVENT HANDLING
   ===================================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  if(act==='burger'){ $('#hdr').classList.toggle('open'); e.preventDefault(); return; }
  if(act==='add'){ addToCart(el.dataset.id,1); e.preventDefault(); return; }
  if(act==='add-qty'){
    const q=parseInt($('#pdQty')?.textContent||'1',10);
    addToCart(el.dataset.id,q); e.preventDefault(); return;
  }
  if(act==='pd-inc'){ const n=$('#pdQty'); n.textContent=Math.min(20,parseInt(n.textContent,10)+1); return; }
  if(act==='pd-dec'){ const n=$('#pdQty'); n.textContent=Math.max(1,parseInt(n.textContent,10)-1); return; }
  if(act==='q-inc'){ const l=state.cart.find(x=>x.id===el.dataset.id); setQty(el.dataset.id,l.qty+1); return; }
  if(act==='q-dec'){ const l=state.cart.find(x=>x.id===el.dataset.id); setQty(el.dataset.id,l.qty-1); return; }
  if(act==='remove'){ setQty(el.dataset.id,0); toast('Removed from cart'); return; }

  if(act==='logout'){
    localStorage.removeItem('oth_uid'); state.user=null;
    logAct('system','User signed out'); save();
    toast('Signed out'); location.hash='#/'; render(); e.preventDefault(); return;
  }
  if(act==='auth-tab'){
    const tab=el.dataset.tab;
    $$('.tab[data-act="auth-tab"]').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
    $('#loginForm').classList.toggle('hide',tab!=='login');
    $('#regForm').classList.toggle('hide',tab!=='register');
    return;
  }

  /* ---- marketing studio ---- */
  if(act==='variant' && state.studio){
    const s=state.studio;
    const p=DB.products.find(x=>x.id===s.productId);
    const nc=generateCreative({product:p,platform:s.platform,angle:s.angle,tone:s.tone,format:s.format},Math.random);
    nc.slug=s.slug; nc.published=s.published;
    state.studio=nc; toast('New variant generated'); render(); return;
  }
  if(act==='publish' && state.studio){
    const s=state.studio;
    const ex=DB.campaigns.find(x=>x.slug===s.slug);
    if(ex){ ex.published=true; } else { DB.campaigns.unshift({...s,published:true}); }
    s.published=true;
    logAct(state.user.name,'Published landing page '+s.slug); save();
    toast('Landing page published'); render(); return;
  }
  if(act==='copy-slug' && state.studio){
    const url=location.origin+location.pathname+'#/l/'+state.studio.slug;
    navigator.clipboard?.writeText(url).then(()=>toast('Landing page link copied'),()=>toast(url));
    return;
  }
  if(act==='toggle-pub'){
    const c=DB.campaigns.find(x=>x.id===el.dataset.id);
    c.published=!c.published;
    logAct(state.user.name,(c.published?'Published ':'Unpublished ')+c.slug); save(); render(); return;
  }
  if(act==='toggle-soon'){
    const p=DB.products.find(x=>x.id===el.dataset.id);
    p.soon=!p.soon; if(!p.soon && !p.stock) p.stock=20;
    logAct(state.user.name,(p.soon?'Marked coming soon: ':'Launched: ')+p.name); save(); render(); return;
  }
  if(act==='new-product'){
    const name=prompt('Product name'); if(!name) return;
    const price=parseFloat(prompt('Price (R)','99.99')); if(isNaN(price)) return;
    const unit=prompt('Unit','1kg')||'1kg';
    const id=uid('p');
    DB.products.push({id,name,sub:unit+' · new',cat:'fish',type:'frozen',price,unit,hue:190+Math.floor(Math.random()*80),
      kind:'fish',stock:0,soon:true,desc:'Newly added to the range.'});
    logAct(state.user.name,'Added product: '+name); save(); render(); toast('Product added — mark it live when ready'); return;
  }
});

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='sort'){ const r=parseRoute(); location.hash=`#/shop?f=${r.q.f||'all'}&sort=${el.value}`; return; }
  if(act==='set-status'){
    const o=DB.orders.find(x=>x.id===el.dataset.id); if(!o) return;
    o.status=el.value;
    if(!o.history.find(h=>h.status===el.value)) o.history.push({status:el.value,t:Date.now()});
    logAct(state.user.name,`Order ${o.id} → ${el.value}`);
    save(); toast(o.id+' updated'); render(); return;
  }
  if(act==='set-role'){
    if(!state.user || state.user.role!=='owner') return;
    const u=DB.users.find(x=>x.id===el.dataset.id); if(!u) return;
    u.role=el.value; logAct(state.user.name,`Role change: ${u.email} → ${el.value}`);
    save(); toast('Role updated'); render(); return;
  }
  if(act==='set-price'){
    const p=DB.products.find(x=>x.id===el.dataset.id);
    const v=parseFloat(el.value); if(isNaN(v)) return;
    p.price=v; save(); toast(p.name+' price updated'); return;
  }
  if(act==='set-stock'){
    const p=DB.products.find(x=>x.id===el.dataset.id);
    const v=parseInt(el.value,10); if(isNaN(v)) return;
    p.stock=v; save(); toast(p.name+' stock updated'); return;
  }
});

document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();

  if(f.id==='loginForm'){
    const fd=new FormData(f);
    const u=DB.users.find(x=>x.email.toLowerCase()===String(fd.get('email')).toLowerCase() && x.pw===hashPw(fd.get('pw')));
    if(!u){ toast('Email or password is incorrect'); return; }
    state.user=u; localStorage.setItem('oth_uid',u.id);
    logAct(u.name,'Signed in'); save();
    toast('Welcome back, '+u.name.split(' ')[0]);
    location.hash = u.role==='owner'?'#/owner':(u.role==='admin'?'#/admin':'#/account');
    render(); return;
  }

  if(f.id==='regForm'){
    const fd=new FormData(f);
    const email=String(fd.get('email')).toLowerCase();
    if(DB.users.find(x=>x.email.toLowerCase()===email)){ toast('That email is already registered'); return; }
    const u={id:uid('u'),name:fd.get('name'),email,pw:hashPw(fd.get('pw')),role:'client',created:Date.now()};
    DB.users.push(u); state.user=u; localStorage.setItem('oth_uid',u.id);
    logAct(u.name,'Created an account'); save();
    toast('Account created'); location.hash='#/account'; render(); return;
  }

  if(f.id==='coForm'){
    const fd=new FormData(f);
    const lines=cartLines(); if(!lines.length) return;
    const sub=cartSub(), del=cartDelivery();
    const items=lines.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty}));
    const r=parseRoute();
    const o={
      id:'OTH-'+(100400+DB.orders.length*7+Math.floor(Math.random()*6)),
      userId: state.user?state.user.id:'guest',
      name:fd.get('name'), email:fd.get('email'), phone:fd.get('phone'),
      address:fd.get('address'), city:fd.get('city'), postal:fd.get('postal'),
      notes:fd.get('notes')||'', items, sub, delivery:del, total:sub+del,
      payment:fd.get('payment'), status:STATUSES[0],
      history:[{status:STATUSES[0],t:Date.now()}],
      created:Date.now(), campaign: currentSession().campaign||'direct',
    };
    DB.orders.unshift(o);
    currentSession().converted=true;
    currentSession().orderIds=(currentSession().orderIds||[]).concat(o.id);
    state.cart=[]; saveCart(); save();
    track('purchase',{order:o.id,total:o.total});
    logAct(o.name,'Placed order '+o.id+' ('+money(o.total)+')');
    toast('Order placed — '+o.id);
    location.hash='#/order/'+o.id; render(); return;
  }

  if(f.id==='trackForm'){
    const fd=new FormData(f);
    const num=String(fd.get('order')).trim().toUpperCase();
    const email=String(fd.get('email')||'').trim().toLowerCase();
    const o=DB.orders.find(x=>x.id.toUpperCase()===num && (!email || x.email.toLowerCase()===email));
    const box=$('#trackResult');
    if(!o){ box.innerHTML=`<div class="note warn">No order found with that number${email?' and email':''}. Check the number and try again.</div>`; return; }
    const idx=STATUSES.indexOf(o.status);
    box.innerHTML=`
      <div class="note ok"><b>${esc(o.id)}</b> · ${esc(o.status)} · placed ${fmtDate(o.created)}</div>
      <ul class="timeline" style="margin-top:18px">
        ${STATUSES.map((s,i)=>{
          const h=o.history.find(x=>x.status===s);
          const cls=i<idx?'done':(i===idx?'done cur':'');
          return `<li class="${cls}"><span class="dot"></span><b>${s}</b><small>${h?fmtDT(h.t):'Pending'}</small></li>`;
        }).join('')}
      </ul>
      <a class="btn btn-primary btn-sm" style="margin-top:16px" href="#/order/${o.id}">Full order details</a>`;
    track('track_lookup',{order:o.id});
    return;
  }

  if(f.id==='studioForm'){
    const fd=new FormData(f);
    const p=DB.products.find(x=>x.id===fd.get('productId'));
    const seedRaw=parseInt(fd.get('seed'),10);
    const R = isNaN(seedRaw)? Math.random : rng(seedRaw*7919+3);
    const c=generateCreative({product:p,platform:fd.get('platform'),angle:fd.get('angle'),
      tone:fd.get('tone'),format:fd.get('format')},R);
    c.published=false;
    state.studio=c;
    logAct(state.user.name,'Generated creative for '+p.name);
    save(); toast('Creative generated'); render();
    setTimeout(()=>{ const el=$('#studioForm'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60);
    return;
  }
});

  $('#hdr').classList.remove('open');
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
  render();
});
